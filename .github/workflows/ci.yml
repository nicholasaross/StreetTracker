name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.10
        # Match .python-version so cp310 torch wheels would resolve if
        # we did install them. Default 3.12 was a leftover from before
        # the Jetson Orin port forced 3.10.
        run: uv python install 3.10

      - name: Install dependencies (no torch / ultralytics on CI)
        # This job runs the common-layer + non-Jetson device tests (which
        # use aiohttp + asyncio mocks, not real torch) and skips the heavy
        # ML stack to stay fast; the torch-gated tests run in `test-torch`
        # below. Device-only tests are gated by `-m device` (currently no
        # tests use that marker; reserved for the eventual on-Jetson smoke).
        # Use an explicit venv: GitHub runner images now ship a PEP 668
        # "externally managed" system Python that refuses --system pip
        # installs.
        run: |
          uv venv
          uv pip install \
            "numpy>=1.26,<3.0" \
            "Pillow>=10" \
            "jinja2>=3.1" \
            "opencv-python-headless>=4.10" \
            "aiohttp>=3.9" \
            "rapidfuzz>=3.6" \
            "requests>=2.32" \
            "pytest>=8" \
            "pytest-asyncio>=0.24" \
            "ruff>=0.6" \
            "mypy>=1.10"

      - name: Lint
        run: uv run --no-sync ruff check src/ tests/

      - name: Lint the analysis scripts
        # .claude/*.py are the record of how published numbers were produced.
        # They are held to pyflakes only (undefined names, unused imports),
        # not to the package's style rules. tests/test_claude_scripts.py
        # checks that what they use from the package still exists.
        run: uv run --no-sync ruff check --select F .claude/

      - name: Format
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Type-check
        # Config is [tool.mypy] in pyproject.toml. Modules this job doesn't
        # install (torch, ultralytics, the alpr extra) are treated as Any.
        run: uv run --no-sync mypy

      - name: Test (common layer)
        run: uv run --no-sync pytest -m "not device" -v tests/
        env:
          PYTHONPATH: src

  test-torch:
    # The make/colour/body-type classifier tests need torch, so the fast job
    # above skips all eight modules (pytest.importorskip). Run them here on
    # CPU wheels: without this job they only ever ran on the dev box.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies (CPU torch)
        # torch + torchvision come from PyTorch's CPU index: the default
        # PyPI Linux wheels bundle CUDA and are several GB. Everything else
        # comes from PyPI in a second step so one index can't shadow the
        # other. scipy is for the CompCars-format fixtures (scipy.io.savemat).
        run: |
          uv venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.10" \
            "torchvision>=0.25"
          uv pip install \
            "numpy>=1.26,<3.0" \
            "Pillow>=10" \
            "jinja2>=3.1" \
            "opencv-python-headless>=4.10" \
            "aiohttp>=3.9" \
            "rapidfuzz>=3.6" \
            "requests>=2.32" \
            "scipy>=1.11" \
            "pytest>=8" \
            "pytest-asyncio>=0.24"

      - name: Test (torch-gated modules)
        run: uv run --no-sync pytest -m "not device" -v -rs tests/test_analysis/test_makemodel
        env:
          PYTHONPATH: src
