name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.10
        # Match .python-version so cp310 torch wheels would resolve if
        # we did install them. Default 3.12 was a leftover from before
        # the Jetson Orin port forced 3.10.
        run: uv python install 3.10

      - name: Install dependencies (no torch / ultralytics on CI)
        # CI runs only common-layer + non-Jetson device tests (which use
        # aiohttp + asyncio mocks, not real torch). Skip the heavy ML
        # stack to keep CI fast. Device-only tests are gated by
        # `-m device` (currently no tests use that marker; reserved for
        # the eventual on-Jetson smoke).
        # Use an explicit venv: GitHub runner images now ship a PEP 668
        # "externally managed" system Python that refuses --system pip
        # installs.
        run: |
          uv venv
          uv pip install \
            "numpy>=1.26,<3.0" \
            "Pillow>=10" \
            "jinja2>=3.1" \
            "opencv-python-headless>=4.10" \
            "aiohttp>=3.9" \
            "rapidfuzz>=3.6" \
            "pytest>=8" \
            "pytest-asyncio>=0.24" \
            "ruff>=0.6"

      - name: Lint
        run: uv run --no-sync ruff check src/ tests/

      - name: Test (common layer)
        run: uv run --no-sync pytest -m "not device" -v tests/
        env:
          PYTHONPATH: src
