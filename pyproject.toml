[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streettracker"
version = "0.1.0"
description = "Detect, track, and summarize vehicles and persons from video and live RTSP"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nicholas Aross" }]

dependencies = [
    "ultralytics>=8.4,<9.0",
    "opencv-python>=4.10",
    "torch>=2.10",
    "torchvision>=0.25",
    "lap>=0.5.12",
    "numpy>=1.26,<3.0",
    "Pillow>=10",
    "jinja2>=3.1",
    "requests>=2.32",
    # Async HTTP client (snapshotter) + dashboard (aiohttp.web). The
    # device runtime is asyncio-based; this is the single async-IO
    # primitive both PR 3b and PR 3d depend on.
    "aiohttp>=3.9",
    # Fuzzy plate matching in the vehicles aggregator -- collapses
    # OCR variants of the same physical plate (e.g. "2X7711" vs
    # "LX7711") into one Vehicle record. Pure-Python+Cython, no
    # heavy deps. ~50 KB.
    "rapidfuzz>=3.6",
    # Required by `streettracker export-engine`: Ultralytics' .pt -> .onnx -> .engine
    # pipeline imports `onnx` (graph build) and `onnxslim` (graph simplify); the
    # in-tree exporter also validates the .onnx via onnxruntime CPU.
    "onnx>=1.16",
    "onnxslim>=0.1",
    # Upper-bound at <1.24: onnxruntime 1.24+ dropped cp310 wheels (cp311+ only),
    # and the Jetson aarch64 venv is locked to cp310 for the torch wheel.
    #
    # aarch64-only: `onnxruntime` (CPU) and the alpr extra's
    # `onnxruntime-gpu` are the SAME import module and install to the
    # same `onnxruntime/` dir, so on the x86 dev box (which installs the
    # alpr extra) co-installing both lets whichever landed last win --
    # a resync can silently flip inference to CPU-only. The Orin
    # (aarch64) needs the CPU build for `export-engine`'s onnx
    # validation and never runs ALPR, so gate the CPU build to aarch64
    # and let onnxruntime-gpu be the sole provider on x86. CI installs
    # neither (explicit minimal `uv pip install`), so it's unaffected.
    "onnxruntime>=1.18,<1.24; platform_machine == 'aarch64'",
    # Required at runtime by the community Jetson aarch64 torch wheel (cp310,
    # sm_87). Not needed on x86_64 where the PyPI cu126 wheel doesn't link
    # against cuDSS.
    'nvidia-cudss-cu12>=0.7; sys_platform == "linux" and platform_machine == "aarch64"',
]

[project.optional-dependencies]
alpr = [
    "easyocr>=1.7,<2.0",
    "fast-plate-ocr>=0.3",
    "open-image-models>=0.2",
    # Cap onnxruntime-gpu below 1.20 so it resolves on Python 3.10 (the
    # Jetson torch wheel index only stocks cp310 on the JP6 channel, so
    # the project's .python-version stays at 3.10 until JP7). 1.19.x has
    # cp310 wheels; later versions are cp311+ only.
    "onnxruntime-gpu>=1.18,<1.20",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Needed for `async def test_...` in the device-runtime test suite
    # (snapshotter, dashboard, runtime). asyncio_mode=auto is configured
    # under [tool.pytest.ini_options].
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
streettracker = "streettracker.cli:main"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Community-built Jetson aarch64 wheels (cp310, sm_87) for JetPack 6.x +
# CUDA 12.6. PyPI's pytorch-cu126 only ships sm_80 / sm_90, which
# explicitly excludes the Orin's sm_87 — confirmed live as
# `cudaErrorNoKernelImageForDevice` on a kernel launch.
[[tool.uv.index]]
name = "jetson-ai-lab-jp6-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+simple/"
explicit = true

[tool.uv.sources]
# Linux x86_64 (dev box / CI):   PyTorch's official cu126 wheels.
# Windows x86_64 (dev box):       PyTorch's official cu126 wheels. These
#   ship CUDA 12.6 runtime + cuDNN 9 DLLs in `torch/lib/`. ONNX Runtime's
#   CUDA EP picks them up after `analysis/__init__.py` adds that dir to
#   the DLL search path -- no separate `nvidia-cudnn-cu12` install needed.
# Linux aarch64 (Jetson Orin):    community wheels with sm_87 SASS.
# macOS:                          PyPI fallback (no GPU torch).
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/streettracker"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# summary.py is a port of NanoTracker's HTML generator: long JavaScript
# strings are inherent to the inline-template approach. Migration to
# Jinja2 is on the roadmap; until then, suppress line-length only here.
"src/streettracker/common/summary.py" = ["E501"]
# alpr/report.py embeds a Jinja2 HTML template (CSS + script) as a string
# literal — same inline-template trade-off as summary.py above.
"src/streettracker/analysis/alpr/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "device: requires Jetson device with TensorRT + CUDA",
]
